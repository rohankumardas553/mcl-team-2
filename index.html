<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MineShift Command - Add Shift Exception</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #eef2f8;
           color: #0b1f44; font-size: 18px; }
    header { background: #0b2a5b; color: #fff; padding: 16px; }
    header .brand { font-size: 22px; font-weight: bold; }
    nav { margin-top: 8px; }
    nav a { color: #fff; font-weight: bold; text-decoration: underline; font-size: 16px; }
    main { max-width: 560px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 24px; margin: 8px 0 16px; }
    label { display: block; font-weight: bold; margin: 16px 0 6px; }
    select, textarea, input[type=number] {
      width: 100%; font-size: 18px; padding: 14px; min-height: 54px;
      border: 2px solid #0b2a5b; border-radius: 10px; background: #fff; color: #0b1f44; }
    textarea { min-height: 110px; }
    .urgency { display: flex; gap: 8px; }
    .urgency label { flex: 1; margin: 0; }
    .urgency input { position: absolute; opacity: 0; }
    .urgency span { display: block; text-align: center; padding: 14px 4px; min-height: 54px;
      border: 2px solid #6b7280; border-radius: 10px; background: #fff; font-weight: bold; }
    .urgency input:checked + span.low { background: #6b7280; color: #fff; }
    .urgency input:checked + span.medium { background: #f59e0b; border-color: #b45309; color: #1f1300; }
    .urgency input:checked + span.high { background: #dc2626; border-color: #991b1b; color: #fff; }
    .urgency input:focus-visible + span { outline: 3px solid #0b2a5b; outline-offset: 2px; }
    .urgency span.medium { border-color: #f59e0b; }
    .urgency span.high { border-color: #dc2626; }
    button { width: 100%; margin-top: 24px; min-height: 60px; font-size: 20px; font-weight: bold;
             background: #0b2a5b; color: #fff; border: 0; border-radius: 12px; }
    button:disabled { opacity: .6; }
    #msg { margin-top: 16px; padding: 14px; border-radius: 10px; display: none; word-wrap: break-word; }
    #msg.ok { display: block; background: #dcfce7; color: #14532d; border: 2px solid #16a34a; font-weight: bold; }
    #msg.err { display: block; background: #fee2e2; color: #7f1d1d; border: 2px solid #dc2626; }
    footer { text-align: center; padding: 20px 16px; font-size: 14px; color: #0b2a5b; }
  </style>
</head>
<body>
  <header>
    <div class="brand">MineShift Command</div>
    <nav><a href="index.html">Add Shift Exception</a> &nbsp;|&nbsp; <a href="dashboard.html">Dashboard</a></nav>
  </header>
  <main>
    <h1>Add Shift Exception</h1>
    <form id="form">
      <label for="shift">Shift</label>
      <select id="shift" required>
        <option value="">Choose shift</option>
        <option>First</option><option>Second</option><option>Night</option>
      </select>

      <label for="location">Location</label>
      <select id="location" required>
        <option value="">Choose location</option>
        <option>Coal Face A</option><option>Coal Face B</option>
        <option>Haul Road A</option><option>Haul Road B</option>
        <option>Junction A</option><option>Stockyard A</option>
        <option>Siding A</option><option>Siding B</option>
      </select>

      <label for="category">Category</label>
      <select id="category" required>
        <option value="">Choose category</option>
        <option>Coal Despatch</option><option>Dust Suppression</option>
      </select>

      <label for="issue">Issue Type</label>
      <select id="issue" required disabled>
        <option value="">Choose category first</option>
      </select>

      <label for="description">Description</label>
      <textarea id="description" required maxlength="500"></textarea>

      <label for="minutes">Impact Minutes</label>
      <input id="minutes" type="number" inputmode="numeric" min="0" max="1440" step="1" required>

      <label id="urg-label">Urgency</label>
      <div class="urgency" role="radiogroup" aria-labelledby="urg-label">
        <label><input type="radio" name="urgency" value="Low" required><span class="low">Low</span></label>
        <label><input type="radio" name="urgency" value="Medium"><span class="medium">Medium</span></label>
        <label><input type="radio" name="urgency" value="High"><span class="high">High</span></label>
      </div>

      <button type="submit" id="save">Add Exception</button>
    </form>
    <div id="msg" role="status"></div>
  </main>
  <footer>Training prototype &ndash; all data is made up</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    var ISSUES = {
      "Coal Despatch": ["Coal shortage", "Tipper shortage", "Loader breakdown",
        "Siding congestion", "Weighbridge delay", "Haul-road delay", "Weather", "Other"],
      "Dust Suppression": ["Water tanker required", "Water tanker unavailable",
        "Fog cannon required", "Fog cannon unavailable", "Heavy dust",
        "Sprinkling required", "Other"]
    };
    var form = document.getElementById("form");
    var category = document.getElementById("category");
    var issue = document.getElementById("issue");
    var msg = document.getElementById("msg");
    var save = document.getElementById("save");

    function show(kind, text) { msg.className = kind; msg.textContent = text; }

    category.addEventListener("change", function () {
      var list = ISSUES[category.value] || [];
      issue.innerHTML = "";
      var first = document.createElement("option");
      first.value = "";
      first.textContent = list.length ? "Choose issue type" : "Choose category first";
      issue.appendChild(first);
      list.forEach(function (t) {
        var o = document.createElement("option");
        o.textContent = t;
        issue.appendChild(o);
      });
      issue.disabled = !list.length;
    });

    var db = null;
    try {
      var ready = (window.SUPABASE_URL || "").indexOf("PASTE") === -1 &&
                  (window.SUPABASE_PUBLISHABLE_KEY || "").indexOf("sb_publishable_") === 0;
      if (!ready) throw new Error("Database settings in config.js are not filled in yet.");
      db = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_PUBLISHABLE_KEY);
    } catch (e) {
      show("err", "The database is not connected. Please tell the team. Error: " + e.message);
    }

    form.addEventListener("submit", async function (ev) {
      ev.preventDefault();
      if (!db) { show("err", "The database is not connected, so nothing was saved."); return; }
      var urgency = form.querySelector("input[name=urgency]:checked");
      var row = {
        shift: document.getElementById("shift").value,
        location: document.getElementById("location").value,
        category: category.value,
        issue_type: issue.value,
        description: document.getElementById("description").value.trim(),
        impact_minutes: parseInt(document.getElementById("minutes").value, 10),
        urgency: urgency ? urgency.value : "",
        status: "Open"
        // created_at is set by the database; resolved_at is left empty.
      };
      if (!row.description || isNaN(row.impact_minutes) || !row.urgency) {
        show("err", "Please fill in every field.");
        return;
      }
      save.disabled = true;
      show("", "");
      try {
        var res = await db.from("shift_exceptions").insert(row);
        if (res.error) throw new Error(res.error.message);
        show("ok", "Exception recorded successfully.");
        form.reset();
        category.dispatchEvent(new Event("change"));
      } catch (e) {
        show("err", "Sorry, the exception could not be saved. Error: " + e.message);
      }
      save.disabled = false;
    });
  </script>
</body>
</html>
