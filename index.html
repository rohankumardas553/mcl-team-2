<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MineShift Command - Add Shift Exception</title>
  <style>
    * { box-sizing: border-box; }
    :root { --navy: #0b2a5b; --navy-dark: #071c40; --ink: #0b1f44; --line: #c7d2e5; --bg: #eef2f8; }
    body { margin: 0; font-family: "Segoe UI", Roboto, Arial, Helvetica, sans-serif; background: var(--bg);
           color: var(--ink); font-size: 18px; line-height: 1.4; }

    /* Shared header (same on every page) */
    header { background: var(--navy-dark); color: #fff; border-bottom: 4px solid #f59e0b; }
    .bar { max-width: 1240px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap;
           align-items: center; justify-content: space-between; gap: 8px 24px; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 700; letter-spacing: .3px; }
    .mark { width: 38px; height: 38px; border-radius: 9px; background: #fff; color: var(--navy);
            display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; }
    nav { display: flex; gap: 6px; }
    nav a { color: #fff; text-decoration: none; font-weight: 600; font-size: 16px; padding: 10px 16px;
            min-height: 44px; display: inline-flex; align-items: center; border-radius: 10px; }
    nav a:hover { background: rgba(255,255,255,.14); }
    nav a.active { background: #fff; color: var(--navy); }

    main { max-width: 720px; margin: 0 auto; padding: 20px 16px 8px; }
    .title h1 { font-size: 28px; margin: 4px 0 4px; }
    .title p { margin: 0 0 16px; color: #33466b; font-size: 16px; }

    .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px;
            margin-bottom: 16px; box-shadow: 0 2px 8px rgba(11, 42, 91, .08); }
    .card h2 { font-size: 15px; letter-spacing: 1px; text-transform: uppercase; color: var(--navy);
               margin: 0 0 12px; display: flex; align-items: center; gap: 10px; }
    .card h2 .n { width: 26px; height: 26px; border-radius: 50%; background: var(--navy); color: #fff;
                  font-size: 14px; display: inline-flex; align-items: center; justify-content: center; letter-spacing: 0; }
    .field { margin-bottom: 16px; }
    .field:last-child { margin-bottom: 0; }
    .label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 17px; }
    .hint { font-weight: 400; color: #4b5d80; font-size: 14px; }

    select, textarea, input[type=number] {
      width: 100%; font: inherit; padding: 14px; min-height: 56px; color: var(--ink);
      border: 2px solid var(--line); border-radius: 12px; background: #fff; }
    select:focus, textarea:focus, input[type=number]:focus { outline: 3px solid rgba(11, 42, 91, .35); border-color: var(--navy); }
    select:disabled { background: #eef2f8; color: #6b7a99; }
    textarea { min-height: 120px; resize: vertical; }

    /* Big touch choices (radio buttons that look like buttons) */
    .choices { display: grid; gap: 8px; }
    .choices.two { grid-template-columns: repeat(2, 1fr); }
    .choices.three { grid-template-columns: repeat(3, 1fr); }
    .choice { position: relative; display: block; margin: 0; }
    .choice input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; cursor: pointer; margin: 0; }
    .choice span { display: flex; align-items: center; justify-content: center; text-align: center; min-height: 58px;
                   padding: 10px 6px; border: 2px solid var(--line); border-radius: 12px; background: #fff;
                   font-weight: 700; transition: background .12s, border-color .12s; }
    .choice:hover span { border-color: var(--navy); }
    .choice input:checked + span { background: var(--navy); border-color: var(--navy); color: #fff; }
    .choice input:focus-visible + span { outline: 3px solid #f59e0b; outline-offset: 2px; }
    .urgency .low span { border-color: #6b7280; }
    .urgency .medium span { border-color: #f59e0b; }
    .urgency .high span { border-color: #dc2626; }
    .urgency .low input:checked + span { background: #6b7280; border-color: #6b7280; color: #fff; }
    .urgency .medium input:checked + span { background: #f59e0b; border-color: #b45309; color: #1f1300; }
    .urgency .high input:checked + span { background: #dc2626; border-color: #991b1b; color: #fff; }

    .chips { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .chips button { min-height: 44px; padding: 0 16px; font: inherit; font-weight: 700; color: var(--navy);
                    background: #fff; border: 2px solid var(--line); border-radius: 999px; cursor: pointer; }
    .chips button:hover { border-color: var(--navy); }

    #save { width: 100%; min-height: 62px; font: inherit; font-size: 20px; font-weight: 700; color: #fff;
            background: var(--navy); border: 0; border-radius: 14px; cursor: pointer; }
    #save:hover { background: var(--navy-dark); }
    #save:focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }
    #save:disabled { opacity: .6; }

    #msg { margin-top: 16px; padding: 14px; border-radius: 12px; display: none; word-wrap: break-word; }
    #msg.ok { display: block; background: #dcfce7; color: #14532d; border: 2px solid #16a34a; font-weight: 700; }
    #msg.err { display: block; background: #fee2e2; color: #7f1d1d; border: 2px solid #dc2626; }
    #goto { display: block; margin-top: 12px; padding: 16px; min-height: 56px; text-align: center; font-weight: 700;
            color: var(--navy); background: #fff; border: 2px solid var(--navy); border-radius: 12px; text-decoration: none; }
    #goto[hidden] { display: none; }

    footer { text-align: center; padding: 20px 16px 28px; font-size: 14px; color: var(--navy); }

    @media (min-width: 700px) {
      .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .pair .field { margin-bottom: 0; }
      .card { padding: 22px; }
    }
    @media (max-width: 380px) { .choices.three { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <div class="brand"><span class="mark">MS</span>MineShift Command</div>
      <nav>
        <a class="active" href="index.html">Add Shift Exception</a>
        <a href="dashboard.html">Dashboard</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="title">
      <h1>Add Shift Exception</h1>
      <p>Coal Despatch and Dust Suppression. Fill in the three steps and press the button.</p>
    </div>

    <form id="form">
      <section class="card">
        <h2><span class="n">1</span>When and where</h2>
        <div class="field">
          <span class="label" id="shift-label">Shift</span>
          <div class="choices three" role="radiogroup" aria-labelledby="shift-label">
            <label class="choice"><input type="radio" name="shift" value="First" required><span>First</span></label>
            <label class="choice"><input type="radio" name="shift" value="Second"><span>Second</span></label>
            <label class="choice"><input type="radio" name="shift" value="Night"><span>Night</span></label>
          </div>
        </div>
        <div class="field">
          <label class="label" for="location">Location</label>
          <select id="location" required>
            <option value="">Choose location</option>
            <option>Coal Face A</option><option>Coal Face B</option>
            <option>Haul Road A</option><option>Haul Road B</option>
            <option>Junction A</option><option>Stockyard A</option>
            <option>Siding A</option><option>Siding B</option>
          </select>
        </div>
      </section>

      <section class="card">
        <h2><span class="n">2</span>What happened</h2>
        <div class="field">
          <span class="label" id="cat-label">Category</span>
          <div class="choices two" role="radiogroup" aria-labelledby="cat-label">
            <label class="choice"><input type="radio" name="category" value="Coal Despatch" required><span>Coal Despatch</span></label>
            <label class="choice"><input type="radio" name="category" value="Dust Suppression"><span>Dust Suppression</span></label>
          </div>
        </div>
        <div class="field">
          <label class="label" for="issue">Issue Type</label>
          <select id="issue" required disabled>
            <option value="">Choose category first</option>
          </select>
        </div>
        <div class="field">
          <label class="label" for="description">Description</label>
          <textarea id="description" required maxlength="500" placeholder="Describe the problem in a few words"></textarea>
        </div>
      </section>

      <section class="card">
        <h2><span class="n">3</span>How serious</h2>
        <div class="field">
          <label class="label" for="minutes">Impact Minutes <span class="hint">(time lost or expected to be lost)</span></label>
          <input id="minutes" type="number" inputmode="numeric" min="0" max="1440" step="1" required>
          <div class="chips" aria-label="Quick minutes">
            <button type="button" data-min="15">15</button>
            <button type="button" data-min="30">30</button>
            <button type="button" data-min="60">60</button>
            <button type="button" data-min="120">120</button>
          </div>
        </div>
        <div class="field">
          <span class="label" id="urg-label">Urgency</span>
          <div class="choices three urgency" role="radiogroup" aria-labelledby="urg-label">
            <label class="choice low"><input type="radio" name="urgency" value="Low" required><span>Low</span></label>
            <label class="choice medium"><input type="radio" name="urgency" value="Medium"><span>Medium</span></label>
            <label class="choice high"><input type="radio" name="urgency" value="High"><span>High</span></label>
          </div>
        </div>
      </section>

      <button type="submit" id="save">Add Exception</button>
    </form>
    <div id="msg" role="status"></div>
    <a id="goto" href="dashboard.html" hidden>See it on the Dashboard &rarr;</a>
  </main>
  <footer>Training prototype &ndash; all data is made up</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    var ISSUES = {
      "Coal Despatch": ["Coal shortage", "Tipper shortage", "Loader breakdown",
        "Siding congestion", "Weighbridge delay", "Haul-road delay", "Weather", "Other"],
      "Dust Suppression": ["Water tanker required", "Water tanker unavailable",
        "Fog cannon required", "Fog cannon unavailable", "Heavy dust",
        "Sprinkling required", "Other"]
    };
    var form = document.getElementById("form");
    var issue = document.getElementById("issue");
    var minutes = document.getElementById("minutes");
    var msg = document.getElementById("msg");
    var save = document.getElementById("save");

    function picked(name) {
      var r = form.querySelector("input[name=" + name + "]:checked");
      return r ? r.value : "";
    }
    function show(kind, text) {
      msg.className = kind; msg.textContent = text;
      document.getElementById("goto").hidden = (kind !== "ok");
      if (kind) msg.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function fillIssues() {
      var list = ISSUES[picked("category")] || [];
      issue.innerHTML = "";
      var first = document.createElement("option");
      first.value = "";
      first.textContent = list.length ? "Choose issue type" : "Choose category first";
      issue.appendChild(first);
      list.forEach(function (t) {
        var o = document.createElement("option");
        o.textContent = t;
        issue.appendChild(o);
      });
      issue.disabled = !list.length;
    }
    Array.prototype.forEach.call(form.querySelectorAll("input[name=category]"), function (r) {
      r.addEventListener("change", fillIssues);
    });

    Array.prototype.forEach.call(document.querySelectorAll(".chips button"), function (b) {
      b.addEventListener("click", function () { minutes.value = b.getAttribute("data-min"); });
    });

    var db = null;
    try {
      var ready = (window.SUPABASE_URL || "").indexOf("PASTE") === -1 &&
                  (window.SUPABASE_PUBLISHABLE_KEY || "").indexOf("sb_publishable_") === 0;
      if (!ready) throw new Error("Database settings in config.js are not filled in yet.");
      db = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_PUBLISHABLE_KEY);
    } catch (e) {
      show("err", "The database is not connected. Please tell the team. Error: " + e.message);
    }

    form.addEventListener("submit", async function (ev) {
      ev.preventDefault();
      if (!db) { show("err", "The database is not connected, so nothing was saved."); return; }
      var row = {
        shift: picked("shift"),
        location: document.getElementById("location").value,
        category: picked("category"),
        issue_type: issue.value,
        description: document.getElementById("description").value.trim(),
        impact_minutes: parseInt(minutes.value, 10),
        urgency: picked("urgency"),
        status: "Open"
        // created_at is set by the database; resolved_at is left empty.
      };
      if (!row.description || isNaN(row.impact_minutes) || !row.urgency) {
        show("err", "Please fill in every field.");
        return;
      }
      save.disabled = true;
      show("", "");
      try {
        var res = await db.from("shift_exceptions").insert(row);
        if (res.error) throw new Error(res.error.message);
        show("ok", "Exception recorded successfully.");
        form.reset();
        fillIssues();
      } catch (e) {
        show("err", "Sorry, the exception could not be saved. Error: " + e.message);
      }
      save.disabled = false;
    });
  </script>
</body>
</html>
